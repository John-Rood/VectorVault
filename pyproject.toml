[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-vault"
version = "7.4.9.35"
description = "Vector database and generative AI cloud storage"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "John Rood", email = "john@johnrood.com"}]
dependencies = [
  "numpy",
  "requests",
  "httpx",
  "bs4",
  "google-cloud-storage",
  "annoy",
  "faiss-cpu",
  "openai",
  "tiktoken",
  "anthropic>=0.125.0",
  "pymupdf",
  "google-genai>=2.30.1; python_version < '3.11'",
  "google-genai>=3.3.0; python_version >= '3.11'",
]

[project.urls]
Homepage = "https://vectorvault.io"
Repository = "https://github.com/John-Rood/VectorVault"

[tool.setuptools.packages.find]
include = ["vectorvault*"]

[tool.setuptools.package-data]
vectorvault = ["model_catalog.json"]
